@if (loading()) {
    <mat-spinner />
}

@if (error()) {
    <p>{{ error() }}</p>
}

@if (!loading() && !error()) {
    <mat-list>
        @for (g of games(); track g.id) {
            <mat-list-item>
                <a matListItemTitle [routerLink]="['/games', g.id]">{{ g.name }}</a>
            </mat-list-item>
        }
    </mat-list>
}
